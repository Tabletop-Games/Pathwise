name: pathwise
description: An offline route-drawing logic puzzle.
publish_to: none
version: 1.0.0+8

environment:
  sdk: ^3.14.0

dependencies:
  crypto: ^3.0.8
  flutter:
    sdk: flutter
  google_mobile_ads: ^9.2.0
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.5
  material_ui: ^1.11.1
  provider: ^6.1.5
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - LICENSE
    - backend/fortune-prizes.json
    - assets/fonts/OFL.txt
  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf

name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/flutter
            ~/.pub-cache
          key: flutter-${{ runner.os }}-3.50.1-${{ hashFiles('pubspec.lock') }}
      - &flutter
        name: Install Flutter
        run: |
          if [ ! -x "$RUNNER_TEMP/flutter/bin/flutter" ]; then
            git clone --depth 1 --branch 3.50.1 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          fi
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: dart run tool/economy_simulation.dart
      - run: npm --prefix backend ci
      - run: npm --prefix backend test
      - run: npm --prefix backend audit --omit=dev --audit-level=moderate
      - name: Check tracked files for credential patterns
        run: |
          if git grep -l -I -E -- '-----BEGIN ([A-Z ]+ )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{60,}|AIza[A-Za-z0-9_-]{35}' -- ':!backend/*.test.mjs'; then
            exit 1
          fi
  android:
    name: Verify minified Android release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/flutter
            ~/.pub-cache
          key: flutter-android-${{ runner.os }}-3.50.1-${{ hashFiles('pubspec.lock') }}
      - *flutter
      - run: flutter pub get --enforce-lockfile
      - name: Compile Android debug APK
        run: |
          flutter build apk --debug
          test -s build/app/outputs/flutter-apk/app-debug.apk
      - name: Compile Android release artifacts
        env:
          PATHWISE_STORE_PASSWORD: verification-only
          PATHWISE_KEY_PASSWORD: verification-only
          PATHWISE_KEY_ALIAS: verification
        run: |
          export PATHWISE_KEYSTORE="$RUNNER_TEMP/verification.jks"
          keytool -genkeypair -keystore "$PATHWISE_KEYSTORE" -storepass "$PATHWISE_STORE_PASSWORD" \
            -keypass "$PATHWISE_KEY_PASSWORD" -alias "$PATHWISE_KEY_ALIAS" -keyalg RSA -keysize 2048 \
            -validity 1 -dname "CN=Pathwise CI" -noprompt
          flutter build apk --release
          test -s build/app/outputs/native-debug-symbols/release/native-debug-symbols.zip
          flutter build appbundle --release
          python3 tool/prepare_play_bundle.py build/app/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/pathwise-play.aab"
      - name: Check APK, AAB and R8 output
        run: |
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          apk=build/app/outputs/flutter-apk/app-release.apk
          bundle="$RUNNER_TEMP/pathwise-play.aab"
          "$tools/apksigner" verify "$apk"
          "$tools/zipalign" -c -P 16 4 "$apk"
          unzip -tq "$bundle"
          jarsigner -verify "$bundle"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar \
            --output "$RUNNER_TEMP/bundletool.jar"
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle="$bundle"
          python3 tool/verify_android_artifacts.py "$apk" "$bundle"
          test -s build/app/outputs/mapping/release/mapping.txt
          test -s build/app/outputs/mapping/release/resources.txt
          wc -c "$apk" "$bundle"
      - name: Archive Android verification builds
        uses: actions/upload-artifact@v4
        with:
          name: pathwise-android-verification
          retention-days: 14
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk
  ios:
    name: Compile unsigned iOS release
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/flutter
            ~/.pub-cache
          key: flutter-ios-${{ runner.os }}-3.50.1-${{ hashFiles('pubspec.lock') }}
      - *flutter
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --release --no-codesign
      - run: test -s build/ios/iphoneos/Runner.app/Runner

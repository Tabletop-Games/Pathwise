# Copy outside the repository and fill in. Never commit the filled file.
# Secrets (PATHWISE_SESSION_KEYS, PATHWISE_PGS_WEB_CLIENT_SECRET) are mounted
# from Secret Manager with --set-secrets; they do not belong here.
PATHWISE_ENV: production
PATHWISE_ONLINE_ENABLED: 'false'          # 'true' only after the checklist in docs/deployment.md
PATHWISE_MIN_BUILD: '0'                   # raise to force an update of older builds
PATHWISE_INTEGRITY_REQUIRED: 'false'      # 'true' once Play Integrity is set up and the client sends tokens
PATHWISE_APP_CERT_SHA256: ''              # Play App Signing certificate SHA-256, base64url, comma-separated
PATHWISE_REWARDS_ENABLED: 'false'
PATHWISE_ADMOB_REWARDED: ''               # e.g. ca-app-pub-XXXXXXXXXXXXXXXX/NNNNNNNNNN (coins, crates, boosts)
PATHWISE_ADMOB_EXTRA_HINT: ''             # rewarded hint unit
PATHWISE_ADMOB_WHEEL: ''                  # rewarded Fortune Wheel unit
PATHWISE_PGS_WEB_CLIENT_ID: ''            # OAuth web client used by Play Games server-side access
PATHWISE_RTDN_AUDIENCE: ''                # audience configured on the Pub/Sub push subscription
PATHWISE_RTDN_SERVICE_ACCOUNT: ''         # service account the push subscription authenticates as
PATHWISE_RECONCILE_AUDIENCE: ''           # audience configured on the Cloud Scheduler job
PATHWISE_RECONCILE_SERVICE_ACCOUNT: ''    # service account the scheduler job authenticates as

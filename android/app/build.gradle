plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def signingInputs = [
    store: providers.environmentVariable("PATHWISE_KEYSTORE").orNull ?: keystoreProperties.getProperty("storeFile"),
    storePassword: providers.environmentVariable("PATHWISE_STORE_PASSWORD").orNull ?: keystoreProperties.getProperty("storePassword"),
    alias: providers.environmentVariable("PATHWISE_KEY_ALIAS").orNull ?: keystoreProperties.getProperty("keyAlias"),
    keyPassword: providers.environmentVariable("PATHWISE_KEY_PASSWORD").orNull ?: keystoreProperties.getProperty("keyPassword"),
]

// Dart's production ad flag and Android's SDK metadata must be configured together.
def dartDefines = (findProperty("dart-defines") ?: "").split(",")
    .findAll { !it.isEmpty() }
    .collectEntries {
        def pair = new String(it.decodeBase64(), "UTF-8").split("=", 2)
        [(pair[0]): pair.size() == 2 ? pair[1] : ""]
    }
def gamesProject = providers.environmentVariable("PATHWISE_GAMES_PROJECT_ID").orNull ?: "0"
if (!(gamesProject ==~ /[0-9]{1,24}/)) {
    throw new GradleException("PATHWISE_GAMES_PROJECT_ID must be the numeric Play Games project ID.")
}

dependencies {
    implementation "com.google.android.gms:play-services-games-v2:22.1.0"
}

def productionAds = dartDefines["PATHWISE_ADS_ENABLED"] == "true"
def verifyAdConsent = dartDefines["PATHWISE_ADS_VERIFY_CONSENT"] == "true"
def testAdmobAppId = "ca-app-pub-3940256099942544~3347511713"
def admobAppId = providers.environmentVariable("PATHWISE_ADMOB_APP_ID").orNull ?:
    dartDefines["PATHWISE_ADMOB_APP_ID"]
def validAdmobAppId = admobAppId ==~ /ca-app-pub-[0-9]{16}~[0-9]{10}/ &&
    !admobAppId.startsWith("ca-app-pub-3940256099942544~")
if ((productionAds || verifyAdConsent || admobAppId) && !validAdmobAppId) {
    throw new GradleException("Production ads require a valid PATHWISE_ADMOB_APP_ID.")
}

android {
    buildFeatures { resValues = true }
    namespace = "games.tabletop.pathwise"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }

    defaultConfig {
        applicationId = "games.tabletop.pathwise"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        resValue "string", "pathwise_games_project", gamesProject
        manifestPlaceholders["pathwiseAdmobAppId"] = testAdmobAppId
    }

    if (signingInputs.values().every { it }) {
        signingConfigs {
            release {
                def storeTarget = file(signingInputs.store)
                if (!storeTarget.exists() && rootProject.file(signingInputs.store).exists()) {
                    storeTarget = rootProject.file(signingInputs.store)
                }
                storeFile = storeTarget
                storePassword = signingInputs.storePassword
                keyAlias = signingInputs.alias
                keyPassword = signingInputs.keyPassword
            }
        }
    } else if (signingInputs.values().any { it }) {
        throw new GradleException("Set all four PATHWISE signing variables or leave all unset.")
    }

    buildTypes {
        release {
            manifestPlaceholders["pathwiseAdmobAppId"] = admobAppId ?: testAdmobAppId
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt")
            if (signingInputs.values().every { it }) {
                signingConfig = signingConfigs.release
            }
            ndk {
                debugSymbolLevel = "SYMBOL_TABLE"
            }
        }
    }

}

flutter {
    source = "../.."
}

plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

def signingInputs = [
    store: providers.environmentVariable("PATHWISE_KEYSTORE").orNull,
    storePassword: providers.environmentVariable("PATHWISE_STORE_PASSWORD").orNull,
    alias: providers.environmentVariable("PATHWISE_KEY_ALIAS").orNull,
    keyPassword: providers.environmentVariable("PATHWISE_KEY_PASSWORD").orNull,
]

// Dart's production ad flag and Android's SDK metadata must be configured together.
def dartDefines = (findProperty("dart-defines") ?: "").split(",")
    .findAll { !it.isEmpty() }
    .collectEntries {
        def pair = new String(it.decodeBase64(), "UTF-8").split("=", 2)
        [(pair[0]): pair.size() == 2 ? pair[1] : ""]
    }
def gamesProject = providers.environmentVariable("PATHWISE_GAMES_PROJECT_ID").orNull ?: "0"
if (!(gamesProject ==~ /[0-9]{1,24}/)) {
    throw new GradleException("PATHWISE_GAMES_PROJECT_ID must be the numeric Play Games project ID.")
}

dependencies {
    implementation "com.google.android.gms:play-services-games-v2:22.1.0"
}

def productionAds = dartDefines["PATHWISE_ADS_ENABLED"] == "true"
def admobAppId = providers.environmentVariable("PATHWISE_ADMOB_APP_ID").orNull
if (productionAds && (!admobAppId || !(admobAppId ==~ /ca-app-pub-[0-9]{16}~[0-9]{10}/)
        || admobAppId.startsWith("ca-app-pub-3940256099942544~"))) {
    throw new GradleException("Production ads require a valid PATHWISE_ADMOB_APP_ID.")
}

android {
    buildFeatures { resValues = true }
    namespace = "games.tabletop.pathwise"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "games.tabletop.pathwise"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        resValue "string", "pathwise_games_project", gamesProject
        manifestPlaceholders["pathwiseAdmobAppId"] = productionAds
            ? admobAppId : "ca-app-pub-3940256099942544~3347511713"
    }

    if (signingInputs.values().every { it }) {
        signingConfigs {
            release {
                storeFile = file(signingInputs.store)
                storePassword = signingInputs.storePassword
                keyAlias = signingInputs.alias
                keyPassword = signingInputs.keyPassword
            }
        }
    } else if (signingInputs.values().any { it }) {
        throw new GradleException("Set all four PATHWISE signing variables or leave all unset.")
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt")
            if (signingInputs.values().every { it }) {
                signingConfig = signingConfigs.release
            }
            ndk {
                debugSymbolLevel = "SYMBOL_TABLE"
            }
        }
    }

}

flutter {
    source = "../.."
}
